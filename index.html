<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudyHub - Trợ lý Học tập Cá nhân cho Sinh viên</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <!-- PWA Meta & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyHub">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col md:flex-row antialiased transition-colors duration-200">

  <!-- ==================== DESKTOP SIDEBAR ==================== -->
  <aside class="hidden md:flex flex-col w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800/80 p-4 justify-between flex-shrink-0 z-30 select-none">
    <div>
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 px-3 py-3 mb-6">
        <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i data-lucide="graduation-cap" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
            StudyHub
          </h1>
          <p class="text-[11px] font-medium text-slate-400">Góc học tập sinh viên</p>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">Điều hướng</div>
      <nav id="sidebar-nav" class="space-y-1.5"></nav>

      <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800/80">
        <button id="sidebar-btn-trash" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-slate-800 transition cursor-pointer">
          <span class="flex items-center gap-2.5">
            <i data-lucide="trash-2" class="w-4 h-4 text-rose-500"></i>
            <span>Thùng rác</span>
          </span>
          <span id="sidebar-trash-count" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold">0</span>
        </button>
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="pt-4 border-t border-slate-100 dark:border-slate-800/80 space-y-2">
      <!-- Dark mode switch -->
      <button id="btn-theme-toggle" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <span class="flex items-center gap-2.5">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden text-slate-500"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:inline text-amber-400"></i>
          <span id="theme-label">Giao diện: Tối</span>
        </span>
        <span class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">Đổi</span>
      </button>

      <!-- App version & offline notice -->
      <div class="px-3.5 py-2 text-[11px] text-slate-400 flex items-center justify-between">
        <span>StudyHub v1.0</span>
        <span class="flex items-center gap-1 text-emerald-500 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          Offline OK
        </span>
      </div>
    </div>
  </aside>

  <!-- ==================== MOBILE TOP HEADER ==================== -->
  <header class="md:hidden flex items-center justify-between px-4 py-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
        <i data-lucide="graduation-cap" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-slate-900 dark:text-white leading-none">StudyHub</h1>
        <span id="mobile-view-name" class="text-[11px] text-indigo-600 dark:text-indigo-400 font-semibold">Thời khóa biểu</span>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <button id="btn-global-search-mobile" class="p-2 rounded-xl text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" aria-label="Tìm kiếm nhanh">
        <i data-lucide="search" class="w-4 h-4"></i>
      </button>
      <button id="btn-open-trash-mobile" class="p-2 rounded-xl text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" aria-label="Thùng rác">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
      <button id="btn-theme-toggle-mobile" class="p-2 rounded-xl text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" aria-label="Đổi giao diện">
        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:inline text-amber-400"></i>
      </button>
      <button id="btn-quick-add-mobile" class="p-2 rounded-xl bg-indigo-600 text-white shadow-sm" aria-label="Thêm buổi học">
        <i data-lucide="plus" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT WRAPPER ==================== -->
  <main class="flex-1 flex flex-col min-w-0 pb-safe md:pb-6 overflow-y-auto">
    <!-- Desktop Top Bar -->
    <div class="hidden md:flex items-center justify-between px-8 py-4 bg-white/70 dark:bg-slate-900/70 backdrop-blur border-b border-slate-200/80 dark:border-slate-800/80 sticky top-0 z-20">
      <div>
        <h2 id="desktop-view-title" class="text-xl font-bold text-slate-900 dark:text-white">Thời khóa biểu</h2>
        <p class="text-xs text-slate-400 mt-0.5" id="desktop-today-date">Thứ Tư, 23/09/2026</p>
      </div>

      <div class="flex items-center gap-3">
        <!-- Global Search Palette Trigger -->
        <button id="btn-global-search" class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 hover:border-slate-300 dark:hover:border-slate-600 text-xs font-medium transition cursor-pointer" title="Tìm kiếm nhanh (Ctrl+K)">
          <i data-lucide="search" class="w-3.5 h-3.5 text-indigo-500"></i>
          <span>Tìm kiếm...</span>
          <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded text-slate-500 dark:text-slate-400">Ctrl+K</kbd>
        </button>

        <!-- Trash Modal Trigger -->
        <button id="btn-open-trash" class="relative flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs font-semibold transition cursor-pointer" title="Thùng rác">
          <i data-lucide="trash-2" class="w-3.5 h-3.5 text-rose-500"></i>
          <span>Thùng rác</span>
          <span id="trash-badge-count" class="hidden px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[10px] font-extrabold leading-none">0</span>
        </button>

        <!-- Quick Data Backup / Export Button -->
        <button id="btn-backup-data" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs font-semibold transition" title="Sao lưu dữ liệu ra file JSON">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>Sao lưu</span>
        </button>

        <!-- Restore Data Button -->
        <label for="input-restore-data" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs font-semibold transition cursor-pointer" title="Phục hồi dữ liệu từ file JSON">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i>
          <span>Khôi phục</span>
        </label>
        <input type="file" id="input-restore-data" accept=".json" class="hidden" />
      </div>
    </div>

    <!-- Active Views Container -->
    <div class="p-4 md:p-8 max-w-7xl w-full mx-auto flex-1">
      <!-- 1. Dashboard View -->
      <section id="dashboard-view" class="view-panel hidden"></section>

      <!-- 2. Schedule View -->
      <section id="schedule-view" class="view-panel"></section>

      <!-- 3. Notes View -->
      <section id="notes-view" class="view-panel hidden"></section>

      <!-- 4. Mindmap View -->
      <section id="mindmap-view" class="view-panel hidden"></section>

      <!-- 5. Image Notes View -->
      <section id="image-notes-view" class="view-panel hidden"></section>
    </div>
  </main>

  <!-- ==================== MOBILE BOTTOM NAVIGATION ==================== -->
  <nav id="bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 flex items-center justify-around px-2"></nav>

  <!-- ==================== TOAST & MODAL CONTAINERS ==================== -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none *:pointer-events-auto"></div>
  <div id="modal-container"></div>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
